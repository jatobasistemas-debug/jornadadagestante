project_id = "jornada-da-gestante"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/callback?next=/auth/nova-senha"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 10
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
[auth.email.template.recovery]
subject = "Recupere seu acesso à Jornada da Gestante"
content_path = "./supabase/templates/recovery.html"
[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_refresh = 150
